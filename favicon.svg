<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="192" height="192" rx="38" ry="38"/>
    </clipPath>
  </defs>
  <!-- 紫グラデーション背景（角丸） -->
  <rect x="0" y="0" width="192" height="192" rx="38" ry="38" fill="url(#bg)"/>
  <!-- ロゴ画像を中央に配置 -->
  <image href="logo.png" x="16" y="16" width="160" height="160" clip-path="url(#clip)"/>
</svg>
